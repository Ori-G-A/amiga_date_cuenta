<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amiga date cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: oklch(97% 0.013 85); }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes panelIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes underlineDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes amigaIn { from { opacity: 0; transform: translateY(24px) rotate(-1.5deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
      @keyframes bubbleIn { 0% { opacity: 0; transform: scale(0.9) translateY(8px); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1) translateY(0); } }
      input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.6; }
      .adc-row:hover { background: var(--paper-deep); }
      .adc-link:hover { color: var(--accent); }
      .adc-danger:hover { color: var(--danger); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
